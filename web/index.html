<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="فسحة الحفّاظ - مكتبة الألعاب والأنشطة التربوية لحلقات تحفيظ القرآن الكريم. إعداد: كتاب حي - جوهرة لتعليم القرآن الكريم.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="فسحة الحفّاظ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>

  <title>فسحة الحفّاظ</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    .loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #F0FDF4 0%, #DCFCE7 100%);
    }
    .loading h1 { color: #166534; font-size: 28px; margin-bottom: 8px; }
    .loading p { color: #15803d; font-size: 16px; margin-bottom: 24px; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #DCFCE7;
      border-top: 4px solid #16A34A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <div class="loading" id="loading">
    <h1>فسحة الحفّاظ</h1>
    <p>جارٍ التحميل...</p>
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // PWA Install
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // Flutter ينادي هذه الدالة لبدء التثبيت
    function promptInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('تم قبول التثبيت');
          }
          deferredPrompt = null;
        });
        return 'available';
      }
      return 'unavailable';
    }
  </script>
</body>
</html>
